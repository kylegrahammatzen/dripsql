name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  smoke-bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Smoke benches
        run: |
          go run ./cmd/bench -query count -rows 10000 -runs 5 -mode hot
          go run ./cmd/bench -query category_groupby -rows 10000 -runs 5 -mode hot
          go run ./cmd/bench -query tpch_q6 -rows 10000 -runs 5 -mode hot
          go run ./cmd/bench -query clickbench_q4 -rows 10000 -runs 5 -mode hot
